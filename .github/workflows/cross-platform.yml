name: cross-platform

on:
  push:
  pull_request:

jobs:
  core-and-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify shell scripts
        run: bash -n bin/*.sh install.sh uninstall.sh
      - name: Test platform-neutral and macOS adapters
        run: python -m unittest tests.test_modularity tests.test_macos_adapter tests.test_architecture_rules
